<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="V808 Records — premium beats with instant licensing, stem downloads and legally binding license contracts."
    />
    <title>V808 Records | Premium Beats & Instant Licensing</title>
    <script>
      // Apply saved theme before paint to avoid flash
      (function () {
        try {
          var t = localStorage.getItem('v808-theme');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
